<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Movie Night</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <!-- Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- jQuery -->
        <script src="jquery-4.0.0.min.js"></script>
        <!-- CSS -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <nav id="hud" class="navbar d-flex jusitfy-content-between position-fixed w-100">
                <div class="nav-item ps-2">
                    <p class="display-5"><i class="bi bi-camera-reels-fill"></i> Movie Night</å>
                </div>

                <div class="nav-item">
                    <div class="btn-group border border-secondary">
                        <button class="btn">Home</button>
                        <button class="btn">Movies</button>
                        <button class="btn">Top Rated</button>
                        <button class="btn">Contact</button>
                    </div>
                </div>

                <div class="nav-item pe-2 d-flex">
                    <div class="input-group">
                    <input type="text" placeholder="Search...">
                    <button class="btn border border-secondary"><i class="bi bi-search"></i></button>
                    </div>
                    <div class="ps-2">
                    <button class="btn border border-secondary dropdown-toggle" data-bs-toggle="dropdown"><span class="navbar-toggler-icon"></span></button>

                    <!-- Making dropdownMenu  -->
                    <div id="dropMenu" class="dropdown-menu dropdown-menu-end">
                    <button class="dropdown-item"> <i class="bi bi-brightness-low"></i>Dark Mode</button>
                    <button class="dropdown-item"><i class="bi bi-brightness-high-fill"></i>Light Mode</button>
                    </div>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <!-- BANNER Carousel -->
            <div id="myCarousel" class="carousel slide bg-primary position-relative" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active ">
                        <img
                        alt="bat"
                        src="https://cdn.pixabay.com/photo/2015/12/06/09/15/maple-1079235_1280.jpg" 
                        >
                    </div>
                    <div class="carousel-item">
                        <img
                        alt="spider"
                        src="https://cdn.pixabay.com/photo/2015/08/03/10/27/banner-873111_1280.jpg"
                        >
                    </div>
                    <div class="carousel-item">
                        <img
                        alt="blackpanter"
                        src="https://cdn.pixabay.com/photo/2015/11/15/08/20/background-1044113_1280.jpg"
                        >
                    </div>
                </div>
                <div id="btnCarousel">
                <button type="button" class="btn carousel-control-next mx-3" data-bs-target="#myCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
                <button type="button" class="btn carousel-control-prev mx-3" data-bs-target="#myCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                </div>

                <div id="textBanner" class="position-absolute">
                    <p class="display-2 fw-bold">Movie Night</p>
                    <p class="h4">Discover great movies and add them <br>to whatchlist.</p>
                    <button class="btn btnBanner"><i class="bi bi-play-circle-fill"></i> Show recomendations</button>
                    <button class="btn btnBanner"><i class="bi bi-film"></i> Browse movie</button>
                </div>
            </div>

            <div id="movieSection" class="m-3">
                <p class="display-5"><i class="bi bi-star-fill"></i> Featured Movies</p>
                <div class="container">
                <div class="row g-5 ">
                    <div class="col col-sm-12 col-xl-3 col-md-6 bg-danger">
                        <img
                        alt="inter"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgDu7wM14h8LOwt1rAldvXmHLt_rLhA16qVI9B8omb7Q&s=10"
                        class="imgSection p-3">
                        <p>Interestellar</p>
                    </div>
                    <div class="col col-sm-12 col-xl-3 col-md-6 p-1 bg-secondary">
                        <img
                        alt="bat"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3PhCcXO0pyxx4bXbkEJbCmPNQNj7nmFjdN1gPy0JCsw&s=10"
                        class="imgSection p-3">
                        <p>The Dark Knight</p>
                    </div>
                    <div class="col col-sm-12 col-xl-3 col-md-6 bg-warning">
                        <img
                        alt="lotr"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnu9jS7PRZTg3OsOED6W1AIxWxblKs4W4Tvlxz-2L5yw&s=10"
                        class="imgSection p-3">
                        <p>The Lord of the Rings</p>
                    </div>
                    <div class="col col-sm-12 col-xl-3 col-md-6 bg-primary">
                        <img
                        alt="inception"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsgXAndLrxHe5wGOIBGs961Km6D9ckI8LJ8lWGlh75pg&s=10"
                        class="imgSection p-3">
                        <p>inception</p>
                    </div>
                </div>
                </div>
            </div>
        </main>

        <footer>
            <!-- place footer here -->
        </footer>



        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
